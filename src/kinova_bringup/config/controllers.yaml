controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: false
    enforce_command_limits: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_position_controller:
      type: position_controllers/JointGroupPositionController

    cartesian_motion_controller:
      type: cartesian_motion_controller/CartesianMotionController

joint_position_controller:
  ros__parameters:
    use_sim_time: false
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    interface_name: position

cartesian_motion_controller:
  ros__parameters:
    use_sim_time: false
    end_effector_link: end_effector_link
    robot_base_link: base_link
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
      - joint_7
    command_interfaces:
      - position
    solver:
      publish_state_feedback: true
      error_scale: 1.0
      iterations: 10
    pd_gains:
      trans_x: {p: 5.0}
      trans_y: {p: 5.0}
      trans_z: {p: 5.0}
      rot_x: {p: 2.0}
      rot_y: {p: 2.0}
      rot_z: {p: 2.0}